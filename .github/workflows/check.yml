name: Validate and deploy Mixlab
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run runtime:setup
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mixlab-static
          path: dist/client

  deploy:
    name: Deploy to Fly.io
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: fly-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Check this is still the latest main commit
        id: revision
        run: |
          latest_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping an outdated main revision."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy pymc-mixlab
        if: steps.revision.outputs.current == 'true'
        run: flyctl deploy --remote-only --ha=false --app pymc-mixlab
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify live site
        if: steps.revision.outputs.current == 'true'
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 45 https://pymc-mixlab.fly.dev/ --output /dev/null
