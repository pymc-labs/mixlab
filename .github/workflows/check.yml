name: Validate Mixlab
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run runtime:setup
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mixlab-static
          path: dist/client
